name: Refresh README

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, at 17 past (the top of the hour is GitHub's busiest moment)
  workflow_dispatch: # a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [main.mustache, build.mjs, .github/workflows/readme.yml]

permissions:
  contents: write

concurrency:
  group: readme

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build README.md
        run: node build.mjs

      - name: Commit it if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Refresh README"
            git push
          fi
